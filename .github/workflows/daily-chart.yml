name: Post daily chart

# Günlük Türkiye Top 5 paylaşımı KAPALI: bundan sonra yalnızca haftalık liste paylaşılır (weekly-chart.yml).
# Elle çalıştırma (workflow_dispatch) hâlâ mümkün. Yeniden açmak için `on:` altına şunu geri ekle:
#   schedule:
#     - cron: '0 */2 * * *'
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Remotion dependencies
        uses: actions/cache@v4
        with:
          path: video/node_modules
          key: remotion-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}

      - run: npm ci

      - name: Ensure ffmpeg
        run: |
          which ffmpeg && exit 0
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=30 && sudo timeout 420 apt-get install -y -qq ffmpeg; then exit 0; fi
            echo "ffmpeg kurulum denemesi $i basarisiz, tekrar deneniyor"; sleep 10
          done
          exit 1

      - run: npm run check:chart
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          TIKTOK_DAILY_MAX: ${{ vars.TIKTOK_DAILY_MAX }}
          # Paylaşım penceresi (TRT). Elle (workflow_dispatch) çalıştırmada kapalı; yoksa repo değişkeni POST_WINDOW, o da yoksa 09:00-23:30.
          POST_WINDOW: ${{ github.event_name == 'workflow_dispatch' && 'off' || vars.POST_WINDOW }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chartState.json data/dailyTemplateState.json
          git diff --staged --quiet || git commit -m "Update chart state [skip ci]"
          git push || (git pull --rebase && git push)
